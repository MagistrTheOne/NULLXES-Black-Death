# NULLXES CERBER — detect head (flight ONNX)
# Perception system: 00_docs/architecture/CERBER.md
# BLOCKED without real weights (export via models/scripts/export_yolo_onnx.py).
model_path: 06_autonomy/models/onnx/detector_alpha.onnx
onnx_layout: yolo_v8_raw
input_name: images
output_name: output0
sha256: ""
input_size: [640, 640]
confidence: 0.35
iou: 0.45
# CERBER detect class order — must match train data.yaml / cerber_data.yaml
classes:
  - human
  - vehicle
  - uav
  - landing_zone
  - obstacle
  - power_line
  - road
  - building
  - forest
  - water
  - fire
  - infrastructure
  - cargo
cameras:
  - forward
  - down
  - left
  - right
providers:
  - CUDAExecutionProvider
  - CPUExecutionProvider
