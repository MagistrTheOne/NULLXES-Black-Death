# CC-BY-4.0 hartwelkisaka
# https://sketchfab.com/3d-models/animated-drone-d47d61f8a78d4cce9f985ad7ade3e403
# Mesh lives in repo NULLXES_BBOX/animated_drone.glb (gitignored *.glb).
id: animated_drone
name: Animated Drone
class: multirotor
manufacturer: hartwelkisaka
configuration: quadrotor
model:
  file: animated_drone.glb
  auto_normalize: true
  scale: 1.0
  up_axis: Z
  forward_axis: Y
camera:
  chase_distance: 5.5
  chase_height: 1.6
  nose_offset: [0.0, 0.22, -0.08]
demo:
  mass_kg: 1.2
  cruise_speed_mps: 12.0
  stall_speed_mps: 4.0
  max_speed_mps: 22.0
  turn_rate_deg: 90.0
animation:
  flight_clip: hover
  hangar_clip: ""
  rotors:
    - {node: prop_1_jnt.34_34, axis: Y, direction: 1.0}
    - {node: prop_2_jnt.35_35, axis: Y, direction: -1.0}
    - {node: prop_3_jnt.36_36, axis: Y, direction: 1.0}
    - {node: prop_4_jnt.37_37, axis: Y, direction: -1.0}
