id: 58drun
name: 58DRUN
class: multirotor
manufacturer: the_Thorminator
configuration: quadrotor
model:
  file: 58drun.glb
  auto_normalize: true
  scale: 1.0
  up_axis: Z
  forward_axis: Y
camera:
  chase_distance: 5.5
  chase_height: 1.6
demo:
  mass_kg: 0.25
  cruise_speed_mps: 10.0
  stall_speed_mps: 4.0
  max_speed_mps: 18.0
  turn_rate_deg: 90.0
animation:
  rotors:
    - {node: Propellor_Lowpoly, axis: Z, direction: 1.0}
  control_surfaces:
    frontwing:
      node: Frontwing_Lowpoly
      source: elevator
      axis: Y
      gain: 1.0
      max_deg: 18.0
    backwing:
      node: Backwing_Lowpoly
      source: elevator
      axis: Y
      gain: -1.0
      max_deg: 18.0
