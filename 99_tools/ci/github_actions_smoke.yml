name: alpha-smoke

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless filterpy PyYAML pytest
      - name: Unit tests (algorithms only)
        run: python -m pytest 10_tests/unit -q
